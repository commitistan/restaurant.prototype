 impCsv=run(async()=>{const f=$('#csv').files[0];if(!f)return;const r=await fetch(`/api/party/parties/${pid}/import`,{method:'POST',body:await f.text()}),j=await r.json();if(!r.ok)throw Error(j.error);party().then(()=>ok(`Imported ${j.imported}, skipped ${j.skipped} (declined or blank)`))}),
 arrange=run(async()=>{await P(`parties/${pid}/arrange`);party()}),addGuest=run(async()=>{await P(`parties/${pid}/guests`,{first:v('gf'),last:v('gl'),tier:v('gt'),household:v('gh'),dietary:v('gd')});party()}),
 passes=run(async()=>{const r=await P(`parties/${pid}/passes`);$('#pass').innerHTML='<div class="card"><b>One-time pass codes. Print or send them now; they cannot be shown again.</b>'+(opt(r,x=>`<div class="row"><span>#${x.no} ${esc(x.place)}</span><b>${x.code}</b></div>`)||'<p>Every guest already has a pass.</p>')+'<button onclick="print()">Print</button></div>'}),
 seatG=run(async id=>{await P(`guests/${id}/seat`,{table_id:+v('gt'+id),seat_no:+v('gs'+id)},'PATCH');party()}),
 checkIn=run(async id=>{await P(`guests/${id}/checkin`,{code:v('gc'+id),id_checked:$('#gi'+id).checked});party()}),checkOut=run(async id=>{await P(`guests/${id}/checkout`);party()}),
 noShow=run(async id=>{await P(`guests/${id}/noshow`);party()}),unlock=run(async id=>{await P(`guests/${id}/unlock`);party()});
async function guests(){$('#view').innerHTML='<h2>Guest analytics</h2>'+kv(await api('party/analytics'))}
Object.assign(V,{party,guests});
init();
</script></body></html>
